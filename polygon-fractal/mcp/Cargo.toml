[package]
name = "polygon-fractal-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server that renders polygon fractals to PNG and SVG"
publish = false

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
base64 = "0.22"
polygon-fractal = { path = ".." }
